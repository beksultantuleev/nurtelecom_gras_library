[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "nurtelecom_gras_library"
version = "2.3.1"
description = "Official Nurtelecom DSML library"
readme = "README.md"
authors = [
    { name = "Beksultan Tuleev", email = "beksultan.tuleev.ds@gmail.com" }
]
license = { file="LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = { "Homepage" = "https://github.com/beksultantuleev/nurtelecom_gras_library.git" }
dependencies = [
    "oracledb",
    "pandas",
    "numpy",
    "python-dotenv",
    "sqlalchemy",
    "openpyxl",
    "requests",
    "hvac"
]

[project.optional-dependencies]
# Spatial features: OracleGeoDataImporter and voronoi_split.
# Install with: pip install nurtelecom_gras_library[geo]
geo = ["geopandas", "shapely", "scipy"]
# SMB network-share support for register_smb_session.
# Install with: pip install nurtelecom_gras_library[smb]
smb = ["smbprotocol"]
# Tableau export support for TableauServerManager.
# Install with: pip install nurtelecom_gras_library[tableau]
tableau = ["tableauserverclient"]
# Development / test tooling: pip install nurtelecom_gras_library[dev]
dev = ["pytest", "geopandas", "shapely", "scipy", "tableauserverclient"]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
nurtelecom_gras_library = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"